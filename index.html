<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Diary</title>
    <!--
      Decodes the redirect that public/404.html performs on GitHub Pages,
      turning "/band-tour-diary/?/tours/abc123" back into a real path
      ("/band-tour-diary/tours/abc123") via history.replaceState before React
      Router mounts. No-op on any other host (the `if` just won't match).
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
